- title: 'On series-parallel pomset languages: Rationality, context-freeness and automata'
  authors:
  - Tobias Kappé
  - Paul Brunet
  - Bas Luttik
  - Alexandra Silva
  - Fabio Zanasi
  id: jlamp2017
  venue:
    name: J. LAMP
    url: https://www.sciencedirect.com/journal/journal-of-logical-and-algebraic-methods-in-programming/vol/103/suppl/C
  links:
    doi: 10.1016/j.jlamp.2018.12.001
    arxiv: 1812.03058
  abstract: >
    Concurrent Kleene Algebra (CKA) is a formalism to study concurrent programs. Like previous Kleene Algebra extensions, developing a correspondence between denotational and operational perspectives is important, both for foundations and for applications. This paper takes an important step towards such a correspondence, by precisely relating bi-Kleene Algebra (BKA), a fragment of CKA, to a novel type of automata called pomset automata (PAs).

    We show that PAs can implement the BKA semantics of series-parallel rational expressions, and that a class of PAs can be translated back to these expressions. We also characterise the behaviour of general PAs in terms of context-free pomset grammars; consequently, universality, equivalence and series-parallel rationality of general PAs are undecidable.
- title: 'Kleene Algebra with Observations'
  authors:
  - Tobias Kappé
  - Paul Brunet
  - Jurriaan Rot
  - Alexandra Silva
  - Jana Wagemaker
  - Fabio Zanasi
  venue:
    name: preprint
  id: kao
  links:
    arxiv: 1811.10401
  abstract: >
     Kleene algebra with tests (KAT) is an algebraic framework for reasoning about the control flow of sequential programs.
     However, when generalising KAT to reason about concurrent programs, axioms native to KAT in conjunction with expected axioms for reasoning about concurrency lead to an unexpected equation.
     In this paper, we propose Kleene algebra with observations (KAO), a variant of KAT, as an alternative foundation for extending KAT to a concurrent setting.
     We characterise the free model of KAO, and establish a decision procedure w.r.t. its equational theory.
- title: 'Equivalence checking for weak bi-Kleene algebra'
  authors:
  - Tobias Kappé
  - Paul Brunet
  - Bas Luttik
  - Alexandra Silva
  - Fabio Zanasi
  venue:
    name: preprint
  id: bka-equivalence-checking
  links:
    arxiv: 1807.02102
  abstract: >
     Pomset automata are an operational model of weak bi-Kleene algebra, which describes program that can fork an execution into parallel threads, upon completion of which execution can join to resume as a single thread.
     We characterize a fragment of pomset automata that admits a decision procedure for language equivalence.
     Furthermore, we prove that this fragment corresponds precisely to series-rational expressions, i.e., rational expressions with an additional operator for bounded parallelism.
     As a consequence, we obtain a new proof that equivalence of series-rational expressions is decidable.
- title: 'Concurrent Kleene Algebra: free model and completeness'
  authors:
  - Tobias Kappé
  - Paul Brunet
  - Alexandra Silva
  - Fabio Zanasi
  id: free-complete
  venue:
    name: ESOP 2018
    url: https://www.etaps.org/index.php/2018/esop
  links:
    arxiv: 1710.02787
    doi: 10.1007/978-3-319-89884-1_30
  abstract: >
    Concurrent Kleene Algebra (CKA) was introduced by Hoare, Moeller, Struth and Wehrman in 2009 as a framework to reason about concurrent programs.
    We prove that the axioms for CKA with bounded parallelism are complete for the semantics proposed in the original paper; consequently, these semantics are the free model for this fragment.
    This result settles a conjecture of Hoare and collaborators.
    Moreover, the techniques developed along the way are reusable; in particular, they allow us to establish pomset automata as an operational model for CKA.
- title: 'Brzozowski goes concurrent: a Kleene theorem for Pomset languages'
  authors:
  - Tobias Kappé
  - Paul Brunet
  - Bas Luttik
  - Alexandra Silva
  - Fabio Zanasi
  id: brzozowski
  venue:
    name: CONCUR 2017
    url: https://www.concur2017.tu-berlin.de/
  links:
    arxiv: 1704.07199
    doi: 10.4230/LIPIcs.CONCUR.2017.25
  abstract: >
    Concurrent Kleene Algebra (CKA) is a mathematical formalism to study programs that exhibit concurrent behaviour.
    As with previous extensions of Kleene Algebra, characterizing the free model is crucial in order to develop the foundations of the theory and potential applications.
    For CKA, this has been an open question for a few years and this paper makes an important step towards an answer.
    We present a new automaton model and a Kleene-like theorem that relates a relaxed version of CKA to series-parallel pomset languages, which are a natural candidate for the free model.
    There are two substantial differences with previous work: from expressions to automata, we use Brzozowski derivatives, which enable a direct construction of the automaton; from automata to expressions, we provide a syntactic characterization of the automata that denote valid CKA behaviours.
